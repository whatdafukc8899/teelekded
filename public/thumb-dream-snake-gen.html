<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&family=DM+Sans:wght@700;800&display=swap');
body{width:800px;height:450px;overflow:hidden;font-family:'Sarabun',sans-serif}
.wrap{width:800px;height:450px;background:linear-gradient(135deg,#1A6B3C 0%,#0D3D22 100%);position:relative;display:flex;flex-direction:column;padding:28px 32px;overflow:hidden}
.bg-circle{position:absolute;border-radius:50%;opacity:.10}
.c1{width:320px;height:320px;background:#4CAF50;top:-100px;right:-80px}
.c2{width:180px;height:180px;background:#81C784;bottom:-60px;left:-40px}
.tag{background:rgba(144,238,144,.2);border:1px solid rgba(144,238,144,.45);color:#90EE90;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;display:inline-block;margin-bottom:12px;letter-spacing:.06em;font-family:'Sarabun',sans-serif}
.title{font-size:36px;font-weight:800;color:#FFF;line-height:1.2;margin-bottom:18px;text-shadow:0 2px 8px rgba(0,0,0,.3);font-family:'Sarabun',sans-serif}
.nums-label{font-size:11px;color:rgba(144,238,144,.9);font-weight:700;letter-spacing:.1em;margin-bottom:8px;font-family:'Sarabun',sans-serif}
.nums-row{display:flex;gap:10px;margin-bottom:20px}
.num{background:rgba(144,238,144,.15);border:1.5px solid rgba(144,238,144,.5);border-radius:10px;padding:8px 14px;text-align:center}
.num-val{font-family:'DM Sans',sans-serif;font-size:26px;font-weight:800;color:#90EE90;display:block}
.num-sub{font-size:9px;color:rgba(255,255,255,.6);margin-top:1px;font-family:'Sarabun',sans-serif}
.cards-row{display:flex;gap:10px}
.card{background:rgba(255,255,255,.08);border-radius:10px;padding:10px 14px;flex:1;border:1px solid rgba(144,238,144,.2)}
.card-icon{font-size:20px;margin-bottom:4px}
.card-title{font-size:10px;color:rgba(144,238,144,.9);font-weight:700;margin-bottom:3px;font-family:'Sarabun',sans-serif}
.card-body{font-size:11px;color:rgba(255,255,255,.75);line-height:1.4;font-family:'Sarabun',sans-serif}
.badge{position:absolute;bottom:28px;right:32px;background:rgba(144,238,144,.2);border:1px solid rgba(144,238,144,.4);border-radius:8px;padding:6px 14px;color:#90EE90;font-size:10px;font-weight:700;font-family:'Sarabun',sans-serif}
.site{position:absolute;top:28px;right:32px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;color:rgba(255,255,255,.5)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bg-circle c1"></div>
  <div class="bg-circle c2"></div>
  <div class="site">www.teelekded.com</div>
  <div class="tag">🐍 ทำนายฝัน · งู</div>
  <div class="title">ฝันเห็นงู<br>หมายถึงอะไร เลขเด็ดคือเลขอะไร?</div>
  <div class="nums-label">🔥 เลขเด็ดยอดนิยม</div>
  <div class="nums-row">
    <div class="num"><span class="num-val">19</span><span class="num-sub">งูเล็ก</span></div>
    <div class="num"><span class="num-val">91</span><span class="num-sub">งูใหญ่</span></div>
    <div class="num"><span class="num-val">16</span><span class="num-sub">งูเขียว</span></div>
    <div class="num"><span class="num-val">61</span><span class="num-sub">งูกัด</span></div>
    <div class="num"><span class="num-val">76</span><span class="num-sub">งูตาย</span></div>
  </div>
  <div class="cards-row">
    <div class="card"><div class="card-icon">🐍</div><div class="card-title">งูเขียว</div><div class="card-body">โชคลาภ · สิ่งดีมาเยือน</div></div>
    <div class="card"><div class="card-icon">⚠️</div><div class="card-title">งูกัด</div><div class="card-body">ระวังศัตรู · ระวังคนใกล้ชิด</div></div>
    <div class="card"><div class="card-icon">💀</div><div class="card-title">งูตาย</div><div class="card-body">ปัญหาสิ้นสุด · โชคใหม่มา</div></div>
    <div class="card"><div class="card-icon">🌟</div><div class="card-title">งูขาว</div><div class="card-body">มงคลสูงสุด · โชคมหาศาล</div></div>
  </div>
  <div class="badge">📖 อ่านเพิ่มเติม teelekded.com</div>
</div>
</body>
</html>
