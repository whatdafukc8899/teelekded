<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:800px;height:450px;overflow:hidden;font-family:'Sarabun',sans-serif;background:#8B5E00}
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&family=DM+Sans:wght@700;800&display=swap');
.wrap{width:800px;height:450px;background:linear-gradient(135deg,#A07000 0%,#5A3D00 100%);position:relative;display:flex;flex-direction:column;padding:28px 32px;overflow:hidden}
.bg-circle{position:absolute;border-radius:50%;opacity:.12}
.c1{width:300px;height:300px;background:#FFD700;top:-80px;right:-60px}
.c2{width:200px;height:200px;background:#FFD700;bottom:-60px;left:-40px}
.logo{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:800;color:rgba(255,255,255,.7);letter-spacing:.06em;margin-bottom:14px}
.tag{background:rgba(255,215,0,.25);border:1px solid rgba(255,215,0,.5);color:#FFD700;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;display:inline-block;margin-bottom:12px;letter-spacing:.06em}
.title{font-size:36px;font-weight:800;color:#FFF;line-height:1.2;margin-bottom:18px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.nums-label{font-size:11px;color:rgba(255,215,0,.9);font-weight:700;letter-spacing:.1em;margin-bottom:8px}
.nums-row{display:flex;gap:10px;margin-bottom:20px}
.num{background:rgba(255,215,0,.2);border:1.5px solid rgba(255,215,0,.6);border-radius:10px;padding:8px 14px;text-align:center}
.num-val{font-family:'DM Sans',sans-serif;font-size:26px;font-weight:800;color:#FFD700;display:block}
.num-sub{font-size:9px;color:rgba(255,255,255,.6);margin-top:1px}
.cards-row{display:flex;gap:10px}
.card{background:rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;flex:1;border:1px solid rgba(255,215,0,.2)}
.card-icon{font-size:20px;margin-bottom:4px}
.card-title{font-size:10px;color:rgba(255,215,0,.9);font-weight:700;margin-bottom:3px}
.card-body{font-size:11px;color:rgba(255,255,255,.8);line-height:1.4}
.badge{position:absolute;bottom:28px;right:32px;background:rgba(255,215,0,.25);border:1px solid rgba(255,215,0,.5);border-radius:8px;padding:6px 14px;color:#FFD700;font-size:10px;font-weight:700}
.site{position:absolute;top:28px;right:32px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;color:rgba(255,255,255,.5)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bg-circle c1"></div>
  <div class="bg-circle c2"></div>
  <div class="site">www.teelekded.com</div>
  <div class="tag">✨ ทำนายฝัน · เงิน · ทอง</div>
  <div class="title">ฝันเห็นเงิน ทอง เพชร<br>เลขอะไรดี?</div>
  <div class="nums-label">🔥 เลขเด็ดยอดนิยม</div>
  <div class="nums-row">
    <div class="num"><span class="num-val">15</span><span class="num-sub">ธนบัตร</span></div>
    <div class="num"><span class="num-val">51</span><span class="num-sub">เสริม</span></div>
    <div class="num"><span class="num-val">89</span><span class="num-sub">ทองแดง</span></div>
    <div class="num"><span class="num-val">98</span><span class="num-sub">ทองแท่ง</span></div>
    <div class="num"><span class="num-val">53</span><span class="num-sub">เพชร</span></div>
  </div>
  <div class="cards-row">
    <div class="card"><div class="card-icon">💰</div><div class="card-title">เงินกองเน่า</div><div class="card-body">โชคใหญ่ · ลาภลอย</div></div>
    <div class="card"><div class="card-icon">🥇</div><div class="card-title">ทองคำ</div><div class="card-body">มั่งคั่ง · ความมั่งคั่งสูง</div></div>
    <div class="card"><div class="card-icon">💎</div><div class="card-title">เพชรพลอย</div><div class="card-body">ความสำเร็จ · ภาวะดีเด่น</div></div>
    <div class="card"><div class="card-icon">🎁</div><div class="card-title">ของขวัญ</div><div class="card-body">มีผู้ให้ช่วยเหลือ</div></div>
  </div>
  <div class="badge">📖 อ่านเพิ่มเติม teelekded.com</div>
</div>
</body>
</html>
